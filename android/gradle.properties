org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# This project must be built with JDK 17.
#
# Gradle 8.13 crashes under JDK 25 (the only error output is the bare version
# string "25.0.1", no stack trace). If your default JDK is newer, point Gradle
# at a JDK 17.
#
# Note: android/local.properties is only read by AGP (for sdk.dir); Gradle
# itself does not read org.gradle.java.home from it during wrapper startup, so
# setting it there has no effect. Put it in the machine-level Gradle config
# ~/.gradle/gradle.properties (GRADLE_USER_HOME/gradle.properties) instead:
#
#   org.gradle.java.home=/path/to/jdk-17
#
# Setting JAVA_HOME works as well.
